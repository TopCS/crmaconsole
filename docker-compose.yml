services:
  crm-a-console:
    build: .
    image: crm-a-console
    container_name: crm-a-console
    ports:
      - "3100:3100"
      # Dev web (profilo "dev", next dev hot-reload). Bind su 127.0.0.1:
      # iterazione dell'operatore, mai pubblico. Il servizio di produzione
      # resta su 3100/funnel — il profilo dev è additivo e off di default.
      - "127.0.0.1:3102:3102"
    volumes:
      - crm-a-data:/root/.openclaw-crm-a
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Secrets come from .env (gitignored) or the shell environment.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Web search provider (openclaw bundled Gemini provider). Optional:
      # when set, the agent's web_search tool auto-detects it.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Direct Composio mode: app connections + agent integration tools talk
      # straight to Composio's Platform API, no Crm-A Cloud key needed.
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY:-}
      # Optional: join your tailnet and expose the Web UI publicly via
      # tailscale funnel (https://crm-a-console.<tailnet>.ts.net).
      # Requires a reusable auth key from the Tailscale admin console and
      # funnel enabled in the tailnet ACLs.
      - TAILSCALE_AUTHKEY=${TAILSCALE_AUTHKEY:-}
      - TAILSCALE_HOSTNAME=${TAILSCALE_HOSTNAME:-crm-a-console}
      # Default model applied at every boot (e.g. openrouter/deepseek/deepseek-v4-pro).
      # Idempotent override — survives volume recreation and manual resets.
      - CRM_A_DEFAULT_MODEL=${CRM_A_DEFAULT_MODEL:-}
      # Phone outbound (NLPearl): condiviso tra la web route e il gateway OpenClaw (tool crm_a_phone_campaign).
      - CRM_A_PHONE_WEBHOOK_SECRET=${CRM_A_PHONE_WEBHOOK_SECRET:-}
      # E-commerce touchpoint (Shopify): API secret verifies the webhook HMAC.
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET:-}
      - SHOPIFY_STORE_DOMAIN=${SHOPIFY_STORE_DOMAIN:-}

  # ── Profilo DEV: hot-reload per l'iterazione su UI/API ──────────────────
  # `docker compose --profile dev up -d crm-a-console-dev`
  # → next dev (turbopack) su http://127.0.0.1:3102 con lo STESSO stato e
  # gateway del container di produzione (network namespace condiviso).
  # Il funnel su :3100 continua a servire la build di produzione: webhook
  # NLPearl/Shopify e demo non vengono toccati. Spegni con
  # `docker compose --profile dev stop crm-a-console-dev`.
  # Prima build di next dev compila on-demand: la prima pagina è lenta,
  # poi hot-reload in secondi.
  crm-a-console-dev:
    image: crm-a-console:latest
    container_name: crm-a-console-dev
    profiles: ["dev"]
    depends_on:
      - crm-a-console
    network_mode: "service:crm-a-console"
    volumes:
      - crm-a-data:/root/.openclaw-crm-a
      - .:/work
    env_file:
      - .env
    environment:
      # next dev with NODE_ENV=production is pathologically slower server-side;
      # the image ENV sets production — force development for the dev instance.
      - NODE_ENV=development
      # The instrumentation terminal WS server defaults to :3101, which the
      # prod container's tailscaled holds in the shared network namespace.
      - TERMINAL_WS_PORT=3103
      - CRM_A_CONSOLE_DAEMONLESS=1
    restart: unless-stopped
    entrypoint: ["bash", "-c"]
    command:
      - cd /work/apps/web && exec node_modules/.bin/next dev --turbo --port 3102 --hostname 0.0.0.0

volumes:
  crm-a-data:
