services:
  # ── Identity provider ─────────────────────────────────────────────────────
  # Keycloak owns users, credentials and realm roles. It has its own
  # PostgreSQL so the CRM database can stay on DuckDB until the migration
  # sprint (where row-level policies will land).
  keycloak-db:
    image: postgres:16-alpine
    container_name: crm-a-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-demo-db-password}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: crm-a-keycloak
    restart: unless-stopped
    command:
      - start
      - --import-realm
      - --http-port=8080
    environment:
      # Bootstrap only: after the first boot, manage admins in Keycloak.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-demo-password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-demo-db-password}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Public browser URL (zrok in the published setup, localhost locally).
      # Backchannel calls from the console use keycloak:8080, so strict
      # hostname checking must not apply to them.
      KC_HOSTNAME: ${CRM_A_KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      # Keep the admin console on a local-only URL; zrok publishes the OIDC
      # surface, not the admin UI.
      KC_HOSTNAME_ADMIN: ${CRM_A_KEYCLOAK_ADMIN_URL:-http://localhost:8080}
      KC_PROXY_HEADERS: xforwarded
    ports:
      # Local only: expose Keycloak beyond localhost only behind TLS + proxy.
      - "127.0.0.1:8080:8080"
    volumes:
      # Realm, roles, demo users, theme. The theme is mounted read-only and
      # extends the stock keycloak.v2 login theme (see deploy/keycloak/).
      - ./deploy/keycloak/realm:/opt/keycloak/data/import:ro
      - ./deploy/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  crm-a-console:
    build: .
    image: crm-a-console
    container_name: crm-a-console
    depends_on:
      keycloak:
        condition: service_healthy

    ports:
      # SEC-06: bind locally by default; publish explicitly only with an
      # authenticated perimeter (see docs/maxxi/SECURITY_GATE.md).
      - "127.0.0.1:3100:3100"
      # Dev web (profilo "dev", next dev hot-reload). Bind su 127.0.0.1:
      # iterazione dell'operatore, mai pubblico. Il servizio di produzione
      # resta su 3100/funnel — il profilo dev è additivo e off di default.
      - "127.0.0.1:3102:3102"
    volumes:
      - crm-a-data:/root/.openclaw-crm-a
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Secrets come from .env (gitignored) or the shell environment.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Keycloak (OIDC). The browser uses ISSUER, the container uses the
      # internal hostname for token/JWKS calls; the `iss` claim stays public.
      # Public identifiers; set these to the zrok URLs when publishing.
      - CRM_A_PUBLIC_URL=${CRM_A_PUBLIC_URL:-http://localhost:3100}
      - CRM_A_KEYCLOAK_PUBLIC_URL=${CRM_A_KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      - CRM_A_OIDC_ISSUER=${CRM_A_OIDC_ISSUER:-http://localhost:8080/realms/crm-a}
      # Inside Compose the server must reach Keycloak by service DNS, even if
      # .env carries the host-oriented localhost value for `next dev`/`start`.
      - CRM_A_OIDC_INTERNAL_ISSUER=${CRM_A_OIDC_INTERNAL_ISSUER_DOCKER:-http://keycloak:8080/realms/crm-a}
      - CRM_A_OIDC_CLIENT_ID=${CRM_A_OIDC_CLIENT_ID:-crm-a-console}
      - CRM_A_OIDC_CLIENT_SECRET=${CRM_A_OIDC_CLIENT_SECRET:-crm-a-demo-client-secret}
      - CRM_A_OIDC_REDIRECT_URI=${CRM_A_OIDC_REDIRECT_URI:-http://localhost:3100/api/auth/callback}
      - CRM_A_OIDC_POST_LOGOUT_REDIRECT_URI=${CRM_A_OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:3100/login}
      # Admin REST client for /maxxi/operators (server-side only).
      - CRM_A_KEYCLOAK_ADMIN_CLIENT_ID=${CRM_A_KEYCLOAK_ADMIN_CLIENT_ID:-crm-a-admin}
      - CRM_A_KEYCLOAK_ADMIN_CLIENT_SECRET=${CRM_A_KEYCLOAK_ADMIN_CLIENT_SECRET:-crm-a-admin-demo-secret}
      - CRM_A_SESSION_SECRET=${CRM_A_SESSION_SECRET:-}
      - CRM_A_SERVICE_TOKEN=${CRM_A_SERVICE_TOKEN:-}
      - CRM_A_DEMO_MODE=${CRM_A_DEMO_MODE:-1}
      # Web search provider (openclaw bundled Gemini provider). Optional:
      # when set, the agent's web_search tool auto-detects it.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Direct Composio mode: app connections + agent integration tools talk
      # straight to Composio's Platform API, no Crm-A Cloud key needed.
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY:-}
      # Optional: join your tailnet and expose the Web UI publicly via
      # tailscale funnel (https://crm-a-console.<tailnet>.ts.net).
      # Requires a reusable auth key from the Tailscale admin console and
      # funnel enabled in the tailnet ACLs.
      - TAILSCALE_AUTHKEY=${TAILSCALE_AUTHKEY:-}
      - TAILSCALE_HOSTNAME=${TAILSCALE_HOSTNAME:-crm-a-console}
      # Default model applied at every boot (e.g. openrouter/deepseek/deepseek-v4-pro).
      # Idempotent override — survives volume recreation and manual resets.
      - CRM_A_DEFAULT_MODEL=${CRM_A_DEFAULT_MODEL:-}
      # Phone outbound (NLPearl): condiviso tra la web route e il gateway OpenClaw (tool crm_a_phone_campaign).
      - CRM_A_PHONE_WEBHOOK_SECRET=${CRM_A_PHONE_WEBHOOK_SECRET:-}
      # E-commerce touchpoint (Shopify): API secret verifies the webhook HMAC.
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET:-}
      - SHOPIFY_STORE_DOMAIN=${SHOPIFY_STORE_DOMAIN:-}

  # ── Profilo DEV: hot-reload per l'iterazione su UI/API ──────────────────
  # `docker compose --profile dev up -d crm-a-console-dev`
  # → next dev (turbopack) su http://127.0.0.1:3102 con lo STESSO stato e
  # gateway del container di produzione (network namespace condiviso).
  # Il funnel su :3100 continua a servire la build di produzione: webhook
  # NLPearl/Shopify e demo non vengono toccati. Spegni con
  # `docker compose --profile dev stop crm-a-console-dev`.
  # Prima build di next dev compila on-demand: la prima pagina è lenta,
  # poi hot-reload in secondi.
  crm-a-console-dev:
    image: crm-a-console:latest
    container_name: crm-a-console-dev
    profiles: ["dev"]
    depends_on:
      - crm-a-console
    network_mode: "service:crm-a-console"
    volumes:
      - crm-a-data:/root/.openclaw-crm-a
      - .:/work
    env_file:
      - .env
    environment:
      # next dev with NODE_ENV=production is pathologically slower server-side;
      # the image ENV sets production — force development for the dev instance.
      - NODE_ENV=development
      # The instrumentation terminal WS server defaults to :3101, which the
      # prod container's tailscaled holds in the shared network namespace.
      - TERMINAL_WS_PORT=3103
      - CRM_A_CONSOLE_DAEMONLESS=1
    restart: unless-stopped
    entrypoint: ["bash", "-c"]
    command:
      - cd /work/apps/web && exec node_modules/.bin/next dev --turbo --port 3102 --hostname 0.0.0.0

  # ── zrok publication (optional profile) ────────────────────────────────
  # Two independent public shares:
  #   console  -> http://crm-a-console:3100
  #   keycloak -> http://keycloak:8080 (OIDC endpoints)
  #
  # Start with:
  #   docker compose --profile zrok up -d --build
  # Required in .env: ZROK_ENABLE_TOKEN and the public URLs/redirect URIs
  # described in docs/maxxi/ZROK.md.
  zrok-console-init:
    profiles: ["zrok"]
    image: busybox
    command: chown -Rc 2171:2171 /home/ziggy/.zrok
    user: root
    volumes:
      - ./deploy/zrok/console:/home/ziggy/.zrok

  zrok-console-enable:
    profiles: ["zrok"]
    image: ${ZROK_CONTAINER_IMAGE:-docker.io/openziti/zrok}
    depends_on:
      zrok-console-init:
        condition: service_completed_successfully
    entrypoint: zrok-enable.bash
    volumes:
      - ./deploy/zrok/console:/home/ziggy/.zrok
    environment:
      ZROK_ENABLE_TOKEN: ${ZROK_ENABLE_TOKEN:-}
      ZROK_API_ENDPOINT: ${ZROK_API_ENDPOINT:-https://api.zrok.io}
      ZROK_ENVIRONMENT_NAME: ${ZROK_ENVIRONMENT_NAME:-crm-a}

  zrok-console:
    profiles: ["zrok"]
    image: ${ZROK_CONTAINER_IMAGE:-docker.io/openziti/zrok}
    entrypoint: zrok-share.bash
    depends_on:
      zrok-console-enable:
        condition: service_completed_successfully
      crm-a-console:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./deploy/zrok/console:/home/ziggy/.zrok
    environment:
      PFXLOG_NO_JSON: "false"
      ZROK_ENABLE_TOKEN: ${ZROK_ENABLE_TOKEN:-}
      ZROK_API_ENDPOINT: ${ZROK_API_ENDPOINT:-https://api.zrok.io}
      ZROK_TARGET: ${ZROK_TARGET:-http://crm-a-console:3100}
      ZROK_UNIQUE_NAME: ${ZROK_UNIQUE_NAME:-crm-a-console}
      ZROK_BACKEND_MODE: proxy
      ZROK_ENVIRONMENT_NAME: ${ZROK_ENVIRONMENT_NAME:-crm-a}
    extra_hosts:
      - "host.docker.internal:${HOST_INTERNAL_IP:-host-gateway}"

  zrok-keycloak-init:
    profiles: ["zrok"]
    image: busybox
    command: chown -Rc 2171:2171 /home/ziggy/.zrok
    user: root
    volumes:
      - ./deploy/zrok/keycloak:/home/ziggy/.zrok

  zrok-keycloak-enable:
    profiles: ["zrok"]
    image: ${ZROK_CONTAINER_IMAGE:-docker.io/openziti/zrok}
    depends_on:
      zrok-keycloak-init:
        condition: service_completed_successfully
    entrypoint: zrok-enable.bash
    volumes:
      - ./deploy/zrok/keycloak:/home/ziggy/.zrok
    environment:
      ZROK_ENABLE_TOKEN: ${ZROK_ENABLE_TOKEN:-}
      ZROK_API_ENDPOINT: ${ZROK_API_ENDPOINT:-https://api.zrok.io}
      ZROK_ENVIRONMENT_NAME: ${ZROK_ENVIRONMENT_NAME:-crm-a}

  zrok-keycloak:
    profiles: ["zrok"]
    image: ${ZROK_CONTAINER_IMAGE:-docker.io/openziti/zrok}
    entrypoint: zrok-share.bash
    depends_on:
      zrok-keycloak-enable:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./deploy/zrok/keycloak:/home/ziggy/.zrok
    environment:
      PFXLOG_NO_JSON: "false"
      ZROK_ENABLE_TOKEN: ${ZROK_ENABLE_TOKEN:-}
      ZROK_API_ENDPOINT: ${ZROK_API_ENDPOINT:-https://api.zrok.io}
      ZROK_TARGET: ${ZROK_KEYCLOAK_TARGET:-http://keycloak:8080}
      ZROK_UNIQUE_NAME: ${ZROK_KEYCLOAK_UNIQUE_NAME:-crm-a-keycloak}
      ZROK_BACKEND_MODE: proxy
      ZROK_ENVIRONMENT_NAME: ${ZROK_ENVIRONMENT_NAME:-crm-a}
    extra_hosts:
      - "host.docker.internal:${HOST_INTERNAL_IP:-host-gateway}"

volumes:
  crm-a-data:
  keycloak-db-data:
