#
# CRM-A login theme — extends the stock Keycloak v2 login theme.
#
# We keep the parent templates and PatternFly behaviour, and only layer our
# palette/typography on top. That keeps upgrades safe: if Keycloak changes its
# markup, the layout still works and only cosmetic selectors may need a review.
#
parent=keycloak.v2
styles=css/styles.css css/crm-a.css
